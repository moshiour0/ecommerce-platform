  stream-processor:
    <<: *python-service
    build:
      context: .
      dockerfile: docker/Dockerfile.python
      args:
        SERVICE_PATH: workers/stream-processor
    environment:
      - PYTHONPATH=/app:/app/shared_libs
    # Worker has no API ports to expose
    command: [ "python", "-m", "app.main" ]
networks:
  mesh:
    external: true
    name: ecommerce-platform_mesh
