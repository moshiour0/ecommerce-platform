    ports:
      - "8006:8006"
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8006" ]

  cart-service:
    <<: *python-service
    build:
      context: .
      dockerfile: docker/Dockerfile.python
      args:
        SERVICE_PATH: services/cart-service
    ports:
      - "8007:8007"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/cart_db
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8007" ]

  pricing-service:
    <<: *python-service
    build:
      context: .
      dockerfile: docker/Dockerfile.python
      args:
        SERVICE_PATH: services/pricing-service
    ports:
      - "8008:8008"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/pricing_db
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8008" ]

  promotion-service:
    <<: *python-service
    build:
      context: .
      dockerfile: docker/Dockerfile.python
      args:
        SERVICE_PATH: services/promotion-service
    ports:
      - "8009:8009"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/promo_db
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8009" ]

  tax-service:
    <<: *python-service
    build:
      context: .
      dockerfile: docker/Dockerfile.python
      args:
        SERVICE_PATH: services/tax-service
    ports:
      - "8010:8010"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/tax_db
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8010" ]

  delivery-quote-service:
    <<: *python-service
    build:
      context: .
      dockerfile: docker/Dockerfile.python
      args:
        SERVICE_PATH: services/delivery-quote-service
    ports:
      - "8011:8011"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/delivery_quote_db
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8011" ]

  order-saga:
    <<: *python-service
    build:
      context: .
      dockerfile: docker/Dockerfile.python
      args:
        SERVICE_PATH: services/order-saga
    ports:
      - "8012:8012"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/order_db
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8012" ]

  inventory-service:
    <<: *python-service
    build:
      context: .
      dockerfile: docker/Dockerfile.python
      args:
        SERVICE_PATH: services/inventory-service
    ports:
      - "8013:8013"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/inventory_db
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8013" ]

  fraud-service:
    <<: *python-service
    build:
      context: .
      dockerfile: docker/Dockerfile.python
      args:
        SERVICE_PATH: services/fraud-service
    ports:
      - "8014:8014"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/fraud_db
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8014" ]

  payment-service:
    <<: *python-service
    build:
      context: .
      dockerfile: docker/Dockerfile.python
      args:
        SERVICE_PATH: services/payment-service
    ports:
      - "8015:8015"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/payment_ledger_db
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8015" ]

  fulfillment-service:
    <<: *python-service
    build:
      context: .
      dockerfile: docker/Dockerfile.python
      args:
        SERVICE_PATH: services/fulfillment-service
    ports:
      - "8016:8016"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/fulfillment_db
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8016" ]

  notification-service:
    <<: *python-service
    build:
      context: .
      dockerfile: docker/Dockerfile.python
      args:
        SERVICE_PATH: services/notification-service
    ports:
      - "8017:8017"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/notification_db
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8017" ]

  media-service:
    <<: *python-service
    build:
      context: .
      dockerfile: docker/Dockerfile.python
      args:
        SERVICE_PATH: services/media-service
    ports:
      - "8018:8018"
    environment:
      # media_meta_db, not media_db. init-dbs.sh creates the former and nothing
      # creates the latter, so this pointed at a database that has never
      # existed. It went unnoticed because the service only served /health and
      # never opened a connection. bootstrap_schema.py and migration 004 had it
      # right all along.
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/media_meta_db
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8018" ]

  audit-service:
    <<: *python-service
    build:
      context: .
      dockerfile: docker/Dockerfile.python
      args:
        SERVICE_PATH: services/audit-service
    ports:
      - "8019:8019"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/audit_db
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8019" ]

  stream-processor:
    <<: *python-service
    build:
      context: .
      dockerfile: docker/Dockerfile.python
      args:
        SERVICE_PATH: workers/stream-processor
    # Consumes Kafka and writes Elasticsearch, so it needs both ready. It
    # previously exited on a cold start with "Connection refused" to
    # elasticsearch:9200 and, having no restart policy, stayed dead.
    depends_on:
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      - PYTHONPATH=/app:/app/shared_libs
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    # Worker has no API ports to expose
    command: [ "python", "-m", "app.main" ]

  # Closes the saga command/event loop (Architecture section 3b). Until this
  # existed the only implementation lived in tests/e2e/, so the state machine
  # could not advance outside a test run.
  saga-dispatcher:
    <<: *python-service
    build:
      context: .
      dockerfile: docker/Dockerfile.python
      args:
        SERVICE_PATH: workers/saga-dispatcher
    ports:
      # Workers occupy 8030-8039 and expose health/metrics only (Rule 2).
      - "8030:8030"
    environment:
      - PYTHONPATH=/app:/app/shared_libs
      - ORDER_DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/order_db
      - SAGA_URL=http://order-saga:8012/orders
      - INVENTORY_URL=http://inventory-service:8013/inventory
      - PAYMENT_URL=http://payment-service:8015/payments
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8030" ]

  reindex-worker:
    <<: *python-service
    build:
      context: .
      dockerfile: docker/Dockerfile.python
      args:
        SERVICE_PATH: workers/reindex-worker
    # Reads catalog and writes Elasticsearch, so it needs both.
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    ports:
      # Workers occupy 8030-8039 and expose health/metrics only (Rule 2).
      - "8033:8033"
    environment:
      - PYTHONPATH=/app:/app/shared_libs
      - CATALOG_DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/catalog_db
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      # 0 means one pass at startup, then idle. A periodic full reindex is a
      # blunt instrument; re-running is a restart or a Job.
      - REINDEX_INTERVAL_SECONDS=${REINDEX_INTERVAL_SECONDS:-0}
      # Deleting read-model documents is the one irreversible thing this
      # worker does, so it is opt-in. REAP_UNDATED additionally allows
      # documents with no timestamp, which can never age out of the grace
      # period and would otherwise survive forever.
      - REAP_ORPHANS=${REAP_ORPHANS:-false}
      - REAP_GRACE_SECONDS=${REAP_GRACE_SECONDS:-3600}
      - REAP_UNDATED=${REAP_UNDATED:-false}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_SERVICE_NAME=reindex-worker
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8033" ]

  dlq-reprocessor:
    <<: *python-service
    build:
      context: .
      dockerfile: docker/Dockerfile.python
      args:
        SERVICE_PATH: workers/dlq-reprocessor
    # Consumes Kafka, so it needs the broker ready. The python-service anchor
    # waits only for Postgres.
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      # Workers occupy 8030-8039 and expose health/metrics only (Rule 2).
      - "8032:8032"
    environment:
      - PYTHONPATH=/app:/app/shared_libs
      # The mesh listener. kafka:9092 is advertised as localhost:9092 and is
      # only usable from the host.
      - KAFKA_BROKER=kafka:29092
      - REDIS_URL=redis://redis:6379
      # Escalations are written to the immutable audit log (§5).
      - AUDIT_URL=http://audit-service:8019/audit
      # §5 default is one hour. Short values are for demonstrating recovery
      # without waiting; production should leave this alone.
      - DLQ_BACKOFF_SECONDS=${DLQ_BACKOFF_SECONDS:-3600}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_SERVICE_NAME=dlq-reprocessor
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8032" ]

  notification-worker:
    <<: *python-service
    build:
      context: .
      dockerfile: docker/Dockerfile.python
      args:
        SERVICE_PATH: workers/notification-worker
    ports:
      # Workers occupy 8030-8039 and expose health/metrics only (Rule 2).
      - "8034:8034"
    environment:
      - PYTHONPATH=/app:/app/shared_libs
      # Claims from notification-service's table. The service owns the
      # notification, the worker owns its delivery (§3b).
      - NOTIFICATION_DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/notification_db
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_SERVICE_NAME=notification-worker
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8034" ]

  webhook-handler:
    <<: *python-service
    build:
      context: .
      dockerfile: docker/Dockerfile.python
      args:
        SERVICE_PATH: workers/webhook-handler
    ports:
      # Workers occupy 8030-8039 (Rule 2). This one is unusual in serving a
      # real external API rather than only health and metrics, because
      # terminating a PSP webhook is what it is for.
      - "8035:8035"
    environment:
      - PYTHONPATH=/app:/app/shared_libs
      # Writes into payment-service's schema. §3b records this as the
      # deliberate exception to Rule 1: the alternative is a synchronous call
      # into payment-service on the webhook path, and a PSP that times out
      # retries, which is the storm this component absorbs.
      - PAYMENT_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/payment_ledger_db
      - REDIS_URL=redis://redis:6379
      # Rule 8: no fallback. A webhook handler without a signing secret accepts
      # anything that reaches it, so compose refuses to start rather than
      # substituting a default committed to the repository.
      - PSP_WEBHOOK_SECRET=${PSP_WEBHOOK_SECRET:?PSP_WEBHOOK_SECRET must be set in .env (see .env.example)}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_SERVICE_NAME=webhook-handler
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8035" ]

networks:
  mesh:
    external: true
    name: ecommerce-platform_mesh
