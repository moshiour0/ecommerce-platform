x-python-service: &python-service
  build:
    context: .
    dockerfile: docker/Dockerfile.python
  networks:
    - mesh

x-node-service: &node-service
  build:
    context: .
    dockerfile: docker/Dockerfile.node
  networks:
    - mesh

services:
  # ==========================================
  # THE SHIELD (EDGE & BFFs)
  # ==========================================
  api-gateway:
    <<: *node-service
    build:
      context: .
      dockerfile: docker/Dockerfile.node
      args:
        SERVICE_PATH: services/api-gateway
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - BFF_SHOP_URL=http://bff-shop:8001
      - BFF_CHECKOUT_URL=http://bff-checkout:8002
      - JWT_SECRET=${JWT_SECRET:-vault-managed-jwt-secret-key-2026}

  bff-shop:
    <<: *node-service
    build:
      context: .
      dockerfile: docker/Dockerfile.node
      args:
        SERVICE_PATH: services/bff-shop
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - CATALOG_SERVICE_URL=http://catalog-service:8005
      - SEARCH_SERVICE_URL=http://search-service:8006
      - CART_SERVICE_URL=http://cart-service:8007

  bff-checkout:
    <<: *node-service
    build:
      context: .
      dockerfile: docker/Dockerfile.node
      args:
        SERVICE_PATH: services/bff-checkout
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
      - CART_SERVICE_URL=http://cart-service:8007
      - CATALOG_SERVICE_URL=http://catalog-service:8005
      - PRICING_SERVICE_URL=http://pricing-service:8008
      - FRAUD_SERVICE_URL=http://fraud-service:8014
      - DELIVERY_QUOTE_SERVICE_URL=http://delivery-quote-service:8011
      - ORDER_SAGA_URL=http://order-saga:8012

  websocket-gateway:
    <<: *node-service
    build:
      context: .
      dockerfile: docker/Dockerfile.node
      args:
        SERVICE_PATH: services/websocket-gateway
    ports:
      - "8003:8003"
    environment:
      - PORT=8003
      - REDIS_URL=redis://redis:6379

  # ==========================================
  # PYTHON MICROSERVICES
  # ==========================================
  user-service:
    <<: *python-service
    build:
      context: .
      dockerfile: docker/Dockerfile.python
      args:
        SERVICE_PATH: services/user-service
    ports:
      - "8004:8004"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/user_db
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8004" ]

  catalog-service:
    <<: *python-service
    build:
      context: .
      dockerfile: docker/Dockerfile.python
      args:
        SERVICE_PATH: services/catalog-service
    ports:
      - "8005:8005"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/catalog_db
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8005" ]

  search-service:
    <<: *python-service
    build:
      context: .
      dockerfile: docker/Dockerfile.python
      args:
        SERVICE_PATH: services/search-service
    ports:
      - "8006:8006"
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8006" ]

  cart-service:
    <<: *python-service
    build:
      context: .
      dockerfile: docker/Dockerfile.python
      args:
        SERVICE_PATH: services/cart-service
    ports:
      - "8007:8007"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/cart_db
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8007" ]

  pricing-service:
