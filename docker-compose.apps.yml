# Every service waits for Postgres to be *healthy*, not merely started. Plain
# depends_on only waits for the container to exist, which is why a from-scratch
# bring-up produced services that had already exited by the time their
# dependency was usable. restart: unless-stopped is the backstop for races no
# healthcheck expresses.
x-python-service: &python-service
  build:
    context: .
    dockerfile: docker/Dockerfile.python
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - mesh

x-node-service: &node-service
  build:
    context: .
    dockerfile: docker/Dockerfile.node
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - mesh

services:
  # ==========================================
  # THE SHIELD (EDGE & BFFs)
  # ==========================================
  api-gateway:
    <<: *node-service
    build:
      context: .
      dockerfile: docker/Dockerfile.node
      args:
        SERVICE_PATH: services/api-gateway
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - BFF_SHOP_URL=http://bff-shop:8001
      - BFF_CHECKOUT_URL=http://bff-checkout:8002
      # Rule 6.3: the trace must start at the edge, not at order-saga.
      # NODE_OPTIONS loads OpenTelemetry before express/axios are
      # required -- instrumentation patches `require`, so importing it
      # from index.js is too late for anything already resolved.
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_SERVICE_NAME=api-gateway
      - NODE_OPTIONS=--require node-common/tracing
      # Rule 8: no hardcoded secret fallbacks. `:?` makes compose refuse to
      # start when JWT_SECRET is unset, rather than substituting a default
      # that is committed to the repository and identical in every deployment.
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env (see .env.example)}
      # Shared store for the tiered rate limiter (Rule: api-gateway boundary).
      - REDIS_URL=redis://redis:6379

  bff-shop:
    <<: *node-service
    build:
      context: .
      dockerfile: docker/Dockerfile.node
      args:
        SERVICE_PATH: services/bff-shop
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - CATALOG_SERVICE_URL=http://catalog-service:8005
      - SEARCH_SERVICE_URL=http://search-service:8006
      - CART_SERVICE_URL=http://cart-service:8007
      # Rule 6.3: the trace must start at the edge, not at order-saga.
      # NODE_OPTIONS loads OpenTelemetry before express/axios are
      # required -- instrumentation patches `require`, so importing it
      # from index.js is too late for anything already resolved.
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_SERVICE_NAME=bff-shop
      - NODE_OPTIONS=--require node-common/tracing

  bff-checkout:
    <<: *node-service
    build:
      context: .
      dockerfile: docker/Dockerfile.node
      args:
        SERVICE_PATH: services/bff-checkout
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
      - CART_SERVICE_URL=http://cart-service:8007
      - CATALOG_SERVICE_URL=http://catalog-service:8005
      - PRICING_SERVICE_URL=http://pricing-service:8008
      - FRAUD_SERVICE_URL=http://fraud-service:8014
      - DELIVERY_QUOTE_SERVICE_URL=http://delivery-quote-service:8011
      - ORDER_SAGA_URL=http://order-saga:8012
      # Rule 6.3: the trace must start at the edge, not at order-saga.
      # NODE_OPTIONS loads OpenTelemetry before express/axios are
      # required -- instrumentation patches `require`, so importing it
      # from index.js is too late for anything already resolved.
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_SERVICE_NAME=bff-checkout
      - NODE_OPTIONS=--require node-common/tracing

  websocket-gateway:
    <<: *node-service
    build:
      context: .
      dockerfile: docker/Dockerfile.node
      args:
        SERVICE_PATH: services/websocket-gateway
    ports:
      - "8003:8003"
    environment:
      - PORT=8003
      - REDIS_URL=redis://redis:6379
      # Rule 6.3: the trace must start at the edge, not at order-saga.
      # NODE_OPTIONS loads OpenTelemetry before express/axios are
      # required -- instrumentation patches `require`, so importing it
      # from index.js is too late for anything already resolved.
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_SERVICE_NAME=websocket-gateway
      - NODE_OPTIONS=--require node-common/tracing

  # ==========================================
  # PYTHON MICROSERVICES
  # ==========================================
  user-service:
    <<: *python-service
    build:
      context: .
      dockerfile: docker/Dockerfile.python
      args:
        SERVICE_PATH: services/user-service
    ports:
      - "8004:8004"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/user_db
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8004" ]

  catalog-service:
    <<: *python-service
    build:
      context: .
      dockerfile: docker/Dockerfile.python
      args:
        SERVICE_PATH: services/catalog-service
    ports:
      - "8005:8005"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/catalog_db
