# Stack tests
#
# The tests that need running infrastructure rather than pure functions: the
# cart cache coherence e2e test and the three concurrency checks. They boot a
# deliberately small slice of the platform -- postgres, redis, cart-service,
# inventory-service, api-gateway -- which is everything those four tests touch
# and nothing else.
#
# Why a slice rather than the whole platform
# ------------------------------------------
# The full stack is 30 containers, five of which are JVMs (Kafka, Zookeeper,
# Schema Registry, Debezium, Elasticsearch). It needs roughly 8 GB, which is
# why it cannot share a machine with the Kubernetes cluster. A GitHub-hosted
# standard runner on a private repository is 2 cores and 8 GB, so the full
# suite would be fighting the runner for memory before the first assertion.
#
# This slice is 5 containers and 3 images, and it covers the assertions most
# worth having automated: the ones about concurrency and cache coherence, which
# are exactly the bugs that do not reproduce on a developer's machine.
#
# test_01 through test_06 stay manual. They exercise the CQRS pipeline
# (Debezium -> Kafka -> Elasticsearch) and the saga, so there is no honest way
# to trim them. See tests/e2e/README.md.

name: Stack tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  stack-tests:
    name: Concurrency and cache checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # bootstrap_schema.py addresses containers as ecommerce-platform-<svc>-1,
      # so the project name is pinned rather than inherited from the checkout
      # directory name.
      COMPOSE_PROJECT_NAME: ecommerce-platform
      MESH: ecommerce-platform_mesh

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Compose refuses to start without JWT_SECRET (Rule 8: no hardcoded
      # secret fallbacks). Generated per run rather than committed, so nothing
      # in this repository looks like a usable signing key.
      - name: Generate a run-scoped JWT secret
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Build and start the slice
        run: |
          docker compose -f docker-compose.yml -f docker-compose.apps.yml \
            up -d --build --wait \
            postgres redis cart-service inventory-service api-gateway

      # --wait returns when containers are healthy or running, but a running
      # uvicorn is not necessarily a listening one. Poll the ports the tests
      # actually use before asserting anything about them.
      - name: Wait for the services to answer
        run: |
          for target in "cart-service 8007" "inventory-service 8013" "api-gateway 8000"; do
            set -- $target
            name=$1; port=$2
            for attempt in $(seq 1 60); do
              if curl -fsS -m 2 "http://localhost:${port}/health" >/dev/null 2>&1; then
                echo "  $name is answering on $port"
                break
              fi
              if [ "$attempt" -eq 60 ]; then
                echo "  $name never answered on $port"
                exit 1
              fi
              sleep 2
            done
          done

      # Postgres creates the databases from init-dbs.sh on a fresh volume; this
      # creates the tables inside them. It skips services whose containers are
      # absent, which is what makes it usable against a slice.
      - name: Bootstrap the schema
        run: python scripts/bootstrap_schema.py

      - name: Install e2e test dependencies
        run: pip install -r tests/e2e/requirements.txt

      - name: Cart cache coherence (e2e test_07)
        run: python test_07_cart_cache_coherence.py
        working-directory: tests/e2e

      - name: Checkout mutex under real contention
        run: |
          docker run --rm -i --network "$MESH" curlimages/curl:8.5.0 \
            sh -s < tests/integration/checkout_mutex.sh

      # inventory_contention.sh deliberately has no auto-seed: it reserves
      # against a product row the caller created, so it can never invent stock.
      - name: Inventory contention with no oversell
        run: |
          PRODUCT_ID=$(python -c "import uuid; print(uuid.uuid4())")
          docker exec ecommerce-platform-postgres-1 psql -U admin -d inventory_db -c \
            "INSERT INTO inventory_items (id, product_id, quantity_available, quantity_reserved)
             VALUES (gen_random_uuid(), '$PRODUCT_ID', 5, 0);"
          docker run --rm -i --network "$MESH" \
            -e PRODUCT_ID="$PRODUCT_ID" -e STOCK=5 -e BUYERS=20 \
            curlimages/curl:8.5.0 sh -s < tests/integration/inventory_contention.sh

      - name: Rate limiter burst
        run: |
          docker run --rm -i --network "$MESH" curlimages/curl:8.5.0 \
            sh -s < tests/integration/rate_limit_burst.sh

      # A failed assertion is usually a service that never came up properly, and
      # the container logs are the only place that shows why.
      - name: Service logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.apps.yml \
            logs --tail 100 postgres redis cart-service inventory-service api-gateway

      - name: Tear down
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.apps.yml down -v
