# Stack tests
#
# The tests that need running infrastructure rather than pure functions: two
# e2e tests about state loss (cart cache, rate limiter) and the four
# concurrency checks. They boot a deliberately small slice of the platform --
# postgres, redis, cart-service, inventory-service, api-gateway, audit-service
# plus minio -- which is everything those tests touch and nothing else.
#
# Why a slice rather than the whole platform
# ------------------------------------------
# The full stack is 36 containers, seven of which are JVMs (three Kafka
# brokers, Zookeeper, Schema Registry, Debezium, Elasticsearch). It needs
# roughly 8 GB, which is why it cannot share a machine with the Kubernetes
# cluster. A GitHub-hosted standard runner on a private repository is 2 cores
# and 8 GB, so the full suite would be fighting the runner for memory before
# the first assertion.
#
# This slice is 7 containers and 5 images, and it covers the assertions most
# worth having automated: the ones about concurrency and about what survives
# losing Redis, which are exactly the bugs that do not reproduce on a
# developer's machine.
#
# test_01 through test_06 stay manual, and so does test_09. The first six
# exercise the CQRS pipeline (Debezium -> Kafka -> Elasticsearch) and the
# saga; test_09 stops a Kafka broker, which needs all three of them here.
# There is no honest way to trim any of it. See tests/e2e/README.md.

name: Stack tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  stack-tests:
    name: Concurrency and cache checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # bootstrap_schema.py addresses containers as ecommerce-platform-<svc>-1,
      # so the project name is pinned rather than inherited from the checkout
      # directory name.
      COMPOSE_PROJECT_NAME: ecommerce-platform
      MESH: ecommerce-platform_mesh

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # Same as `make env`: the stack is configured through .env, and a runner
      # has none because it is gitignored.
      #
      # Setting only JWT_SECRET is not enough, which the first run proved.
      # Every service's DATABASE_URL interpolates ${POSTGRES_USER} and
      # ${POSTGRES_PASSWORD} with no default, so without .env they resolve to
      # empty strings and every service gets postgresql://:@postgres/... and
      # cannot authenticate. Those are the only two variables in either compose
      # file that have no fallback, and .env.example supplies both.
      #
      # The secret is generated per run rather than taken from .env.example, so
      # nothing in this repository is ever a usable signing key.
      - name: Create .env
        run: |
          cp .env.example .env
          SECRET=$(openssl rand -hex 32)
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$SECRET|" .env
          MINIO_SECRET=$(openssl rand -hex 16)
          sed -i "s|^MINIO_ROOT_PASSWORD=.*|MINIO_ROOT_PASSWORD=$MINIO_SECRET|" .env
          echo "POSTGRES_USER=$(grep '^POSTGRES_USER=' .env | cut -d= -f2)"
          echo "JWT_SECRET and MINIO_ROOT_PASSWORD set to generated values"

      # docker-compose.apps.yml overrides the mesh network to external:true with
      # an explicit name, so the merged config expects it to already exist and
      # compose will not create it. On a development machine it does exist --
      # docker-compose.yml alone created it once and it outlived every
      # `compose down`. A runner starts with nothing, which is what the first
      # run hit: "network ecommerce-platform_mesh declared as external, but
      # could not be found", after building all three images.
      #
      # Created here rather than by making the network non-external, because the
      # external declaration is what lets the integration checks attach their
      # own curl container to the same network by name.
      - name: Create the mesh network
        run: |
          docker network inspect "$MESH" >/dev/null 2>&1 || docker network create "$MESH"

      # minio joins the slice for one assertion: that the bucket refuses
      # anonymous reads of confidential prefixes. It is a single small Go
      # binary, so it costs the runner far less than the check is worth -- the
      # failure it guards against is silent, and the thing it exposes is
      # seller KYC documents.
      - name: Build and start the slice
        run: |
          docker compose -f docker-compose.yml -f docker-compose.apps.yml \
            up -d --build --wait \
            postgres redis minio cart-service inventory-service api-gateway audit-service

      # --wait returns when containers are healthy or running, but a running
      # uvicorn is not necessarily a listening one. Poll the ports the tests
      # actually use before asserting anything about them.
      - name: Wait for the services to answer
        run: |
          for target in "cart-service 8007" "inventory-service 8013" "api-gateway 8000" "audit-service 8019"; do
            set -- $target
            name=$1; port=$2
            for attempt in $(seq 1 60); do
              if curl -fsS -m 2 "http://localhost:${port}/health" >/dev/null 2>&1; then
                echo "  $name is answering on $port"
                break
              fi
              if [ "$attempt" -eq 60 ]; then
                echo "  $name never answered on $port"
                exit 1
              fi
              sleep 2
            done
          done

      # Postgres creates the databases from init-dbs.sh on a fresh volume; this
      # creates the tables inside them. It skips services whose containers are
      # absent, which is what makes it usable against a slice.
      - name: Bootstrap the schema
        run: python scripts/bootstrap_schema.py

      # Creates the bucket and applies the policy generated from the purpose
      # taxonomy in media_rules. Run before the check below, which then asks
      # the bucket whether it actually enforces it.
      - name: Bootstrap object storage
        run: |
          pip install 'boto3==1.34.34'
          set -a; . ./.env; set +a
          S3_ACCESS_KEY="$MINIO_ROOT_USER" S3_SECRET_KEY="$MINIO_ROOT_PASSWORD" \
            python scripts/bootstrap_storage.py

      # A bucket with no policy passes the public-prefix half of this and fails
      # the confidential half, which is the failure mode worth catching: it
      # looks completely healthy from the storefront.
      - name: Object storage honours the purpose taxonomy
        run: |
          set -a; . ./.env; set +a
          docker run --rm -i --network "$MESH" \
            -e S3_ACCESS_KEY="$MINIO_ROOT_USER" \
            -e S3_SECRET_KEY="$MINIO_ROOT_PASSWORD" \
            curlimages/curl:8.5.0 sh -s < tests/integration/storage_policy.sh

      - name: Install e2e test dependencies
        run: pip install -r tests/e2e/requirements.txt

      - name: Cart cache coherence (e2e test_07)
        run: python test_07_cart_cache_coherence.py
        working-directory: tests/e2e

      # The limiter's budgets live only in Redis, so losing them grants a
      # fresh allowance. Characterised here, along with the guard that
      # matters: those counters must not be evictable under memory
      # pressure, which would turn that into a per-caller bypass.
      - name: Rate limiter under state loss (e2e test_08)
        run: python test_08_rate_limit_state_loss.py
        working-directory: tests/e2e

      - name: Checkout mutex under real contention
        run: |
          docker run --rm -i --network "$MESH" curlimages/curl:8.5.0 \
            sh -s < tests/integration/checkout_mutex.sh

      # inventory_contention.sh deliberately has no auto-seed: it reserves
      # against a product row the caller created, so it can never invent stock.
      - name: Inventory contention with no oversell
        run: |
          PRODUCT_ID=$(python -c "import uuid; print(uuid.uuid4())")
          docker exec ecommerce-platform-postgres-1 psql -U admin -d inventory_db -c \
            "INSERT INTO inventory_items (id, product_id, quantity_available, quantity_reserved)
             VALUES (gen_random_uuid(), '$PRODUCT_ID', 5, 0);"
          docker run --rm -i --network "$MESH" \
            -e PRODUCT_ID="$PRODUCT_ID" -e STOCK=5 -e BUYERS=20 \
            curlimages/curl:8.5.0 sh -s < tests/integration/inventory_contention.sh

      - name: Rate limiter burst
        run: |
          docker run --rm -i --network "$MESH" curlimages/curl:8.5.0 \
            sh -s < tests/integration/rate_limit_burst.sh

      # Concurrent appends must not fork the audit hash chain: two writers that
      # read the same tail compute the same sequence and link to the same
      # prev_hash. This fires 15 at once and re-hashes the whole log.
      - name: Audit chain under concurrent appends
        run: |
          docker run --rm -i --network "$MESH" curlimages/curl:8.5.0 \
            sh -s < tests/integration/audit_chain_concurrency.sh

      # A failed assertion is usually a service that never came up properly, and
      # the container logs are the only place that shows why.
      - name: Service logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.apps.yml \
            logs --tail 100 postgres redis cart-service inventory-service \
            api-gateway audit-service

      - name: Tear down
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.apps.yml down -v
