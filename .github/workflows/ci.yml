# CI
#
# Runs the two unit tiers on every push and pull request. Both finish in
# seconds and need no infrastructure, because every module under test is a pure
# function extracted from its service for exactly this reason.
#
# The integration and e2e suites are NOT here. They need the full compose stack
# — Postgres, Kafka, Redis, Elasticsearch, Debezium — and assert things like
# "exactly one of ten parallel checkouts wins", which needs a real environment
# rather than a mocked one. They stay manual: tests/integration/README.md and
# tests/e2e/README.md.
#
# There were two 0-byte workflow files in ci/.github/workflows/ before this.
# GitHub only reads .github/workflows at the repository root, so nothing had
# ever run.

name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  python-unit:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/unit -q

  gateway-unit:
    name: API gateway unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # node-version is the Node the TESTS run on, and is 18 to match the
      # runtime image (docker/Dockerfile.node builds on node:18-alpine). It is
      # unrelated to the Node the action itself runs on, which is node24 as of
      # v7 -- do not raise this to match that.
      #
      # Testing on a newer Node than production ships would hide exactly the
      # kind of version difference that `npm test` already ran into: naming the
      # test files explicitly works on one version and not the other, which is
      # why the script is a bare `node --test`.
      - uses: actions/setup-node@v7
        with:
          node-version: '18'

      # No install step: the tests use node:test from the standard library and
      # the service has no dev dependencies. There is no package-lock.json
      # either, so `npm ci` would fail here.
      - name: Run unit tests
        run: npm test
        working-directory: services/api-gateway

      # node-common ships into every Node image, so a break here breaks all of
      # them. Its read_model tests need no dependencies either -- resilience.js
      # requires axios, but the tests import read_model directly rather than
      # through index.js, so nothing has to be installed.
      - name: Run shared Node library tests
        run: npm test
        working-directory: shared/libs/node-common
