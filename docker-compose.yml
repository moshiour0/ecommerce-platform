x-redis-sentinel: &redis-sentinel
  image: redis:7-alpine
  restart: unless-stopped
  depends_on:
    redis:
      condition: service_healthy
  entrypoint: ["/bin/sh", "/etc/redis/redis-sentinel.sh"]
  environment:
    REDIS_MASTER_NAME: ${REDIS_MASTER_NAME:-mymaster}
    REDIS_MASTER_HOST: redis
    REDIS_SENTINEL_QUORUM: "2"
  volumes:
    - ./docker/redis-sentinel.sh:/etc/redis/redis-sentinel.sh:ro
  healthcheck:
    test: ["CMD-SHELL", "redis-cli -p 26379 ping | grep -q PONG"]
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 5s
  networks:
    - mesh

# ------------------------------------------------------------------
# Kafka: three brokers, replication factor 3
# ------------------------------------------------------------------
# One broker meant every topic had exactly one copy of every partition, so
# losing the broker lost the events -- and there was no volume either, so
# `compose down` lost them too. Rule 5 asks for a durable event mesh; a
# single unbacked broker is the same failure the Redis change fixed in
# 3ff64d9, one layer up.
#
# Three is the smallest count where replication survives a loss. With
# min.insync.replicas=2 and acks=all, a write is acknowledged only once two
# brokers hold it, so one broker can die with no acknowledged write lost and
# no producer blocked. Two brokers cannot express that: min.insync=2 with
# RF=2 stops all writes the moment either one goes down, which trades
# durability for an outage.
#
# The shared settings live in a YAML anchor rather than being repeated three
# times, because a durability setting that is right on two brokers out of
# three is not a durability setting.
x-kafka-common: &kafka-common
  image: confluentinc/cp-kafka:7.4.0
  restart: unless-stopped
  depends_on:
    zookeeper:
      condition: service_healthy
  # Broker registration, not port availability: schema-registry fails with
  # "Expected 1 brokers but found only 0" when the port is open but the
  # broker has not yet registered.
  healthcheck:
    test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 >/dev/null 2>&1 || exit 1"]
    interval: 10s
    timeout: 10s
    retries: 30
    start_period: 20s
  networks:
    - mesh

x-kafka-env: &kafka-env
  KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

  # Every topic created from here on gets three copies. This covers the
  # topics nobody creates by hand: Debezium creates one per captured table,
  # and auto-creation covers the DLQs.
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2

  # The internal topics are not exempt. __consumer_offsets at RF=1 means one
  # broker loss rewinds every consumer group to its auto.offset.reset, which
  # for these consumers is `earliest` -- the whole event history reprocessed.
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

  # The setting that decides whether any of the above is real. Left at its
  # default, a broker that was not in the ISR may be elected leader when the
  # in-sync ones are gone, and everything it never received is silently
  # dropped -- acknowledged writes, lost, with no error anywhere. Off means
  # the partition stays unavailable until a broker that actually has the
  # data comes back. Unavailable is recoverable; silently truncated is not.
  KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"

  # The image defaults to a 1 GB heap per broker. Three of those on top of
  # Elasticsearch, Debezium and Schema Registry does not fit the 7.7 GB this
  # stack is given; 512 MB each measured comfortably under the load these
  # tests produce. Raise it if you start pushing real volume through.
  KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"

services:
  # ==========================================
  # FOUNDATION: DATABASES & MESH
  # ==========================================
  # Startup ordering note: plain `depends_on` only waits for a container to
  # *start*, not to be ready. A from-scratch bring-up therefore raced —
  # schema-registry exited because Kafka had no broker yet, and
  # stream-processor exited because Elasticsearch was not listening. Neither
  # had a restart policy, so both stayed dead and the platform came up broken.
  # Infrastructure now declares healthchecks and dependants gate on
  # `condition: service_healthy`, with `restart: unless-stopped` as a backstop
  # for races no healthcheck can express.
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supersecret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh
    # One Debezium connector per service database (Rule 1 + Rule 3) means one
    # logical replication slot per database. Postgres defaults to 10 slots and
    # 10 WAL senders; the platform has 15 outbox-bearing databases, so five
    # connectors failed with "all replication slots are in use" and their
    # services' events never reached Kafka. Headroom left for future services.
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      # Sixteen services with a pool each, plus workers and tooling. The
      # default of 100 was exceeded the first time anything drove real
      # concurrency: Postgres reached 103 and ten unrelated e2e tests failed
      # with read timeouts that read like a dozen separate bugs.
      #
      # 200 leaves headroom above the 160 the resized pools can open. Idle
      # connections are cheap; it is work_mem per active query that costs, and
      # that is unchanged.
      - max_connections=200
      - -c
      - max_replication_slots=25
      - -c
      - max_wal_senders=25
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - mesh

  # ------------------------------------------------------------------
  # Redis: a primary, a replica, and three sentinels
  # ------------------------------------------------------------------
  # Everything this platform keeps in Redis has a durable counterpart, so
  # losing the data is survivable -- test_07 and test_08 prove exactly that.
  # What is not survivable is Redis being *unreachable*: carts stop serving,
  # the rate limiter stops answering, and webhook dedup falls back to Postgres
  # for every call.
  #
  # So the thing being bought here is failover time, not durability, and a
  # bare replica does not buy it -- promoting one by hand is the same outage
  # with extra steps. Sentinel is the part that makes the replica worth
  # having: three of them, quorum two, so one can die and the rest still form
  # a majority.
  #
  # Clients connect through the sentinels rather than to a hostname, because
  # after a failover the container named `redis` is the replica.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    # No --replica-announce-ip. The sentinels work in addresses, not names
    # (docker/redis-sentinel.sh explains why hostnames put sentinel into TILT
    # mode instead of failing over), so a node announcing a hostname would be
    # announcing something its monitor cannot use.
    # The image declares VOLUME /data, so without a named volume here Docker
    # creates an anonymous one per container and every recreate starts empty.
    # That is why a rebuild lost every cart and every rate-limit counter.
    #
    # Redis keeps its default RDB save points (60s/10000 changes at the
    # tightest) and saves on SIGTERM, so an ordinary `compose down` loses
    # nothing. A kill -9 loses at most the window since the last snapshot.
    # AOF would cut that to a second, at the cost of a write per command;
    # carts are backed by Postgres and rate-limit budgets are meant to be
    # short-lived, so neither is worth it here.
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - mesh

  redis-replica:
    image: redis:7-alpine
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "6380:6379"
    # replicaof is the starting position, not a permanent one: after a
    # failover the sentinels rewrite this node's role, and this flag only
    # decides where it begins on a cold start.
    command:
      - redis-server
      - --replicaof
      - redis
      - "6379"
    volumes:
      - redis_replica_data:/data
    # `ping` answers while a replica is still loading its first sync, so it
    # would report healthy before it holds any data. master_link_status is the
    # field that knows whether the handshake actually completed -- see
    # redis_topology.check_replication for why role:slave alone proves nothing.
    #
    # `role:master` is accepted too, and that is not a loophole. Sentinel does
    # not fail back, so after a promotion THIS container is the primary and
    # has no master to be linked to. A check that only accepted a linked
    # replica would mark the healthy, serving primary as unhealthy forever --
    # a false alarm in monitoring, and worse, a `condition: service_healthy`
    # that can never be met on the next bring-up. Found exactly that way: the
    # e2e failover test left this node promoted and the container went red
    # while serving every read and write correctly.
    healthcheck:
      test: ["CMD-SHELL", "redis-cli info replication | grep -qE 'master_link_status:up|role:master'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks:
      - mesh

  # Three sentinels rather than one. A single sentinel is a single point of
  # failure for the *decision* to fail over, which leaves the replica as
  # decoration -- and a quorum of one would let one sentinel that has merely
  # lost the network promote a replica while the real primary is still taking
  # writes.
  #
  # Each is a few megabytes; the whole quorum costs less than one service.
  redis-sentinel-1:
    <<: *redis-sentinel
  redis-sentinel-2:
    <<: *redis-sentinel
  redis-sentinel-3:
    <<: *redis-sentinel

  # Object storage for media bytes. They never pass through a service: uploads
  # go to pre-signed URLs issued by media-service, and public reads come
  # straight from here. MinIO is S3-compatible, so the same code runs against
  # S3 or any equivalent in production by changing three environment variables.
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console
    environment:
      # Rule 8: no hardcoded fallback for a credential. Compose refuses to start
      # rather than running an object store on a password committed to the repo.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in .env (see .env.example)}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env (see .env.example)}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - mesh

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.2
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    # A single-node cluster never reaches green, so yellow is the healthy
    # steady state and must be accepted or nothing depending on ES ever starts.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - mesh

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    # A `ruok` probe is the canonical ZooKeeper check but is unusable here:
    # cp-zookeeper 7.x blocks four-letter commands unless whitelisted, and
    # setting ZOOKEEPER_4LW_COMMANDS_WHITELIST does not take effect because the
    # image's env-to-property translation mangles a name starting with a digit
    # (verified: the variable is present in the container and ZooKeeper still
    # answers "ruok is not executed because it is not in the whitelist").
    # A port check is sufficient here because the real readiness gate is
    # Kafka's own healthcheck, which verifies broker registration rather than
    # port availability.
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - mesh

  kafka:
    <<: *kafka-common
    ports:
      - "9092:9092"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
    volumes:
      - kafka1_data:/var/lib/kafka/data

  kafka-2:
    <<: *kafka-common
    ports:
      - "9093:9093"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:29092,PLAINTEXT_HOST://localhost:9093
    volumes:
      - kafka2_data:/var/lib/kafka/data

  kafka-3:
    <<: *kafka-common
    ports:
      - "9094:9094"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:29092,PLAINTEXT_HOST://localhost:9094
    volumes:
      - kafka3_data:/var/lib/kafka/data

  schema-registry:
    image: confluentinc/cp-schema-registry:7.4.0
    restart: unless-stopped
    # All three, not just the first: creating _schemas with RF=3 fails outright
    # while fewer than three brokers have registered, and Schema Registry does
    # not retry -- it exits.
    depends_on:
      kafka:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092,kafka-2:29092,kafka-3:29092
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      # _schemas holds every Avro schema in the platform. At RF=1 one broker
      # loss makes every Avro consumer unable to deserialise anything.
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 3
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/subjects || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - mesh

  # ==========================================
  # OBSERVABILITY (Rule 6)
  # ==========================================
  # Services already called FastAPIInstrumentor.instrument_app, but only
  # opentelemetry-api was installed and no TracerProvider was ever set, so
  # every span was non-recording and there was nowhere to send one. Without a
  # collector, Rule 6.4's outbox trace injection has nothing to inject.
  jaeger:
    image: jaegertracing/all-in-one:1.57
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # UI
      - "4318:4318"     # OTLP/HTTP receiver
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:16686/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - mesh

  # ==========================================
  # CDC OUTBOX WORKER
  # ==========================================
  debezium:
    build:
      context: ./
      dockerfile: docker/Dockerfile.debezium
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      postgres:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:29092,kafka-2:29092,kafka-3:29092
      CONNECT_GROUP_ID: 1
      CONNECT_CONFIG_STORAGE_TOPIC: my_connect_configs
      CONNECT_OFFSET_STORAGE_TOPIC: my_connect_offsets
      CONNECT_STATUS_STORAGE_TOPIC: my_connect_statuses
      # Connect's own state. my_connect_offsets is where each connector's
      # position in the replication slot lives -- losing it replays or skips
      # CDC depending on the connector's snapshot mode.
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_INTERNAL_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_INTERNAL_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_REST_ADVERTISED_HOST_NAME: debezium
      CONNECT_PLUGIN_PATH: "/usr/share/java,/usr/share/confluent-hub-components"
    # The previous container reported "unhealthy" for an hour while working
    # fine, because it had no healthcheck of its own and Docker inherited a
    # meaningless default. The connector REST API is the real readiness signal.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s
    networks:
      - mesh

networks:
  mesh:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  # The replica keeps its own RDB. Sharing the primary's volume would have two
  # servers writing one dump file, and a failover would then hand the promoted
  # node a snapshot the demoted one was mid-write on.
  redis_replica_data:
  minio_data:
  # One per broker. Without these the log directories lived in the container
  # filesystem, so recreating a broker discarded its replicas -- and recreating
  # all three discarded every event and every consumer offset the platform had.
  kafka1_data:
  kafka2_data:
  kafka3_data:
