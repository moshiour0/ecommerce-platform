# api-gateway — Deployment + Service
# GENERATED by scripts/generate_k8s.py — do not edit by hand.
# Regenerate after changing docker-compose.apps.yml.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ecommerce
  labels:
    app: api-gateway
    tier: service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: api-gateway
        tier: service
    spec:
      containers:
      - name: api-gateway
        image: ecommerce-platform-api-gateway:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: ecommerce-secrets
              key: JWT_SECRET
        - name: BFF_CHECKOUT_URL
          value: http://bff-checkout:8002
        - name: BFF_SHOP_URL
          value: http://bff-shop:8001
        - name: NODE_OPTIONS
          value: --require node-common/tracing
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://jaeger:4318
        - name: OTEL_SERVICE_NAME
          value: api-gateway
        - name: PORT
          value: '8000'
        - name: REDIS_URL
          value: redis://redis:6379
        resources:
          requests:
            cpu: 100m
            memory: 192Mi
          limits:
            cpu: 1000m
            memory: 768Mi
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 8000
          name: http
        readinessProbe:
          httpGet: &id001
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet: *id001
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 5
      securityContext:
        fsGroup: 1000
      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: ecommerce
  labels:
    app: api-gateway
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
