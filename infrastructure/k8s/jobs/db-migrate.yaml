# Rule 10 — schema migrations as a Job, never in the app startup path
# GENERATED by scripts/generate_k8s.py — do not edit by hand.
# Regenerate after changing docker-compose.apps.yml.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-migrations
  namespace: ecommerce
data:
  001_add_idempotency_result_id.sql: "-- 001: add idempotency_keys.result_id\n--\n-- The S-1 remediation\
    \ added result_id to every IdempotencyKey model but no\n-- migration was authored, and SQLAlchemy's\
    \ create_all() never alters an\n-- existing table. Every code path that reads result_id therefore\
    \ raised\n-- UndefinedColumnError, so all state-mutating endpoints in these five\n-- services returned\
    \ HTTP 500.\n--\n-- Rule 10: migrations run as a Job/InitContainer, never in the app startup\n-- path.\
    \ Apply with:\n--   for db in order_db inventory_db payment_ledger_db fraud_db cart_db; do\n--   \
    \  psql -U admin -d $db -f migrations/001_add_idempotency_result_id.sql\n--   done\n--\n-- Idempotent:\
    \ safe to re-run.\n--\n-- The CREATE is not redundant. Under compose this file always ran after\n\
    -- bootstrap_schema.py's create_all phase, so the table already existed. On a\n-- fresh Kubernetes\
    \ cluster there is no create_all before the migration Job,\n-- and the bare ALTER failed with 'relation\
    \ \"idempotency_keys\" does not exist',\n-- taking the whole Job down on its first statement. A migration\
    \ must be able\n-- to run against an empty database.\nCREATE TABLE IF NOT EXISTS public.idempotency_keys\
    \ (\n    key        character varying(255) NOT NULL PRIMARY KEY,\n    created_at timestamp with time\
    \ zone\n);\n\nALTER TABLE idempotency_keys ADD COLUMN IF NOT EXISTS result_id UUID;\n"
  002_cart_db_create_cart_state.sql: "-- 002 (cart_db only): create cart_state\n--\n-- The C-1/C-4 checkout-mutex\
    \ work added a CartState model, but no service\n-- calls Base.metadata.create_all() and no Alembic\
    \ migration was ever authored\n-- (16 alembic/ scaffolds, zero versions/). The table never reached\
    \ Postgres,\n-- so every add-to-cart raised UndefinedTableError and returned HTTP 500.\n--\n-- Rule\
    \ 1: this file targets cart_db ONLY. Do not apply it to another database.\n-- Rule 10: run as a Job\
    \ or InitContainer, never in the app startup path.\n--\n--   psql -U admin -d cart_db -f migrations/002_cart_db_create_cart_state.sql\n\
    --\n-- Idempotent: primary key declared inline, indexes use IF NOT EXISTS.\n\nCREATE TABLE IF NOT\
    \ EXISTS public.cart_state (\n    cart_id    uuid                     NOT NULL PRIMARY KEY,\n    user_id\
    \    uuid                     NOT NULL,\n    items      jsonb                    NOT NULL,\n    status\
    \     character varying(50)    NOT NULL,\n    expires_at timestamp with time zone NOT NULL,\n    created_at\
    \ timestamp with time zone\n);\n\nCREATE INDEX IF NOT EXISTS ix_cart_state_user_id\n    ON public.cart_state\
    \ (user_id);\n\n-- The TTL sweeper filters on status and expires_at together, and the atomic\n-- active\
    \ -> checkout_in_progress transition filters on (user_id, status).\nCREATE INDEX IF NOT EXISTS ix_cart_state_status_expires\n\
    \    ON public.cart_state (status, expires_at);\n"
  003_promo_db_create_tables.sql: "-- 003 (promo_db only): create the promotion-service schema\n--\n--\
    \ promo_db was completely empty: no promotions table, and neither of the\n-- per-service scaffolding\
    \ tables. Same root cause as migration 002 \u2014 models\n-- existed in code, nothing ever applied\
    \ them to Postgres.\n--\n-- Rule 1: this file targets promo_db ONLY. idempotency_keys and\n-- outbox_messages\
    \ are per-service tables, never shared; each service owns\n-- its own copy inside its own database.\n\
    -- Rule 10: run as a Job or InitContainer, never in the app startup path.\n--\n--   psql -U admin\
    \ -d promo_db -f migrations/003_promo_db_create_tables.sql\n--\n-- Idempotent: primary keys declared\
    \ inline, indexes use IF NOT EXISTS.\n\nCREATE TABLE IF NOT EXISTS public.promotions (\n    id   \
    \              uuid                     NOT NULL PRIMARY KEY,\n    code               character varying(50)\
    \    NOT NULL,\n    discount_percent   integer                  NOT NULL,\n    max_discount_cents\
    \ integer                  NOT NULL,\n    is_active          boolean                  NOT NULL,\n\
    \    created_at         timestamp with time zone,\n    expires_at         timestamp with time zone\n\
    );\n\nCREATE UNIQUE INDEX IF NOT EXISTS ix_promotions_code\n    ON public.promotions (code);\n\n--\
    \ ---------------- per-service scaffolding ----------------\n\nCREATE TABLE IF NOT EXISTS public.idempotency_keys\
    \ (\n    key        character varying(255) NOT NULL PRIMARY KEY,\n    created_at timestamp with time\
    \ zone\n);\n\n-- Present for parity with the saga-participating services (Rule 4). Harmless\n-- where\
    \ unused; required the moment this service joins a saga path.\nALTER TABLE public.idempotency_keys\
    \ ADD COLUMN IF NOT EXISTS result_id uuid;\n\nCREATE TABLE IF NOT EXISTS public.outbox_messages (\n\
    \    id             uuid                   NOT NULL PRIMARY KEY,\n    aggregate_type character varying(255)\
    \ NOT NULL,\n    aggregate_id   character varying(255) NOT NULL,\n    type           character varying(255)\
    \ NOT NULL,\n    payload        jsonb                  NOT NULL,\n    created_at     timestamp with\
    \ time zone\n);\n\n-- The retention job prunes by age; Debezium reads in insertion order.\nCREATE\
    \ INDEX IF NOT EXISTS ix_outbox_messages_created_at\n    ON public.outbox_messages (created_at);\n"
  004_outbox_for_audit_and_media.sql: "-- 004 (audit_db and media_meta_db): create the outbox table\n\
    --\n-- Both databases were missing outbox_messages entirely, so their Debezium\n-- connectors had\
    \ no table to capture (table.include.list points at\n-- public.outbox_messages) and those services\
    \ could never publish an event.\n--\n-- Rule 3: outbox before Kafka. A service with no outbox table\
    \ cannot\n-- participate in the event mesh at all.\n-- Rule 1: outbox_messages is per-service and\
    \ never shared.\n-- Rule 10: run as a Job or InitContainer, never in the app startup path.\n--\n--\
    \   psql -U admin -d audit_db      -f migrations/004_outbox_for_audit_and_media.sql\n--   psql -U\
    \ admin -d media_meta_db -f migrations/004_outbox_for_audit_and_media.sql\n--\n-- Idempotent: primary\
    \ key inline, index uses IF NOT EXISTS.\n\nCREATE TABLE IF NOT EXISTS public.outbox_messages (\n \
    \   id             uuid                   NOT NULL PRIMARY KEY,\n    aggregate_type character varying(255)\
    \ NOT NULL,\n    aggregate_id   character varying(255) NOT NULL,\n    type           character varying(255)\
    \ NOT NULL,\n    payload        jsonb                  NOT NULL,\n    created_at     timestamp with\
    \ time zone\n);\n\n-- The retention job prunes by age; Debezium reads in insertion order.\nCREATE\
    \ INDEX IF NOT EXISTS ix_outbox_messages_created_at\n    ON public.outbox_messages (created_at);\n\
    \nCREATE TABLE IF NOT EXISTS public.idempotency_keys (\n    key        character varying(255) NOT\
    \ NULL PRIMARY KEY,\n    created_at timestamp with time zone\n);\n\nALTER TABLE public.idempotency_keys\
    \ ADD COLUMN IF NOT EXISTS result_id uuid;\n"
  005_dispatcher_processed_state.sql: "-- 005 (order_db): dispatcher bookkeeping\n--\n-- Two things the\
    \ saga dispatcher needs, neither of which existed.\n--\n-- 1. outbox_messages.processed_at\n--   \
    \ The prototype worker marked a command done by REWRITING its type to\n--    \"<type>_Processed\"\
    . That mutates a row Debezium is streaming, so CDC\n--    emits a second phantom event for a command\
    \ that already ran, and it\n--    destroys the original type so the row can never be replayed or audited.\n\
    --    An outbox row is an immutable record of intent; completion is separate\n--    state.\n--\n--\
    \ 2. processed_events\n--    Rule 4 requires consumers to record what they have applied, in the same\n\
    --    transaction as their business logic, so redelivery is a no-op. It was\n--    mandated but never\
    \ defined and therefore never built.\n--\n-- Rule 10: run as a Job or InitContainer, never in the\
    \ app startup path.\n--   psql -U admin -d order_db -f migrations/005_dispatcher_processed_state.sql\n\
    --\n-- Idempotent.\n\n-- Created here as well as altered: on a fresh cluster there is no create_all\n\
    -- before the migration Job, so a bare ALTER fails on an empty database.\nCREATE TABLE IF NOT EXISTS\
    \ public.outbox_messages (\n    id             uuid                   NOT NULL PRIMARY KEY,\n    aggregate_type\
    \ character varying(255) NOT NULL,\n    aggregate_id   character varying(255) NOT NULL,\n    type\
    \           character varying(255) NOT NULL,\n    payload        jsonb                  NOT NULL,\n\
    \    created_at     timestamp with time zone\n);\n\nALTER TABLE public.outbox_messages\n    ADD COLUMN\
    \ IF NOT EXISTS processed_at timestamp with time zone;\n\n-- The dispatcher claims work with\n-- \
    \  WHERE type LIKE '%Command' AND processed_at IS NULL ... FOR UPDATE SKIP LOCKED\n-- so a partial\
    \ index keeps the claim query cheap as the outbox grows.\nCREATE INDEX IF NOT EXISTS ix_outbox_unprocessed_commands\n\
    \    ON public.outbox_messages (created_at)\n    WHERE processed_at IS NULL;\n\nCREATE TABLE IF NOT\
    \ EXISTS public.processed_events (\n    event_id     uuid                     NOT NULL,\n    consumer\
    \     text                     NOT NULL,\n    event_type   text                     NOT NULL,\n  \
    \  processed_at timestamp with time zone NOT NULL DEFAULT NOW(),\n    PRIMARY KEY (event_id, consumer)\n\
    );\n\n-- Composite key, not event_id alone: two different consumers may legitimately\n-- process the\
    \ same event, and each needs its own record of having done so.\nCREATE INDEX IF NOT EXISTS ix_processed_events_processed_at\n\
    \    ON public.processed_events (processed_at);\n"
  006_dispatcher_claim_lease.sql: "-- 006 (order_db): claim lease for the saga dispatcher\n--\n-- The\
    \ first dispatcher held a Postgres transaction open for the whole batch:\n-- it selected rows FOR\
    \ UPDATE SKIP LOCKED and then made every downstream HTTP\n-- call inside that transaction. With a\
    \ batch of 20 and a 10s timeout, one\n-- transaction could stay open ~200 seconds while holding row\
    \ locks and a\n-- pooled connection, blocking VACUUM and pinning WAL that Debezium must scan.\n--\
    \ Never hold a database transaction across network I/O.\n--\n-- The fix splits the work into two short\
    \ transactions with the HTTP calls\n-- outside both:\n--   1. claim  -- one statement, stamps claimed_at/claimed_by,\
    \ commits\n--   2. work   -- no transaction held\n--   3. settle -- one statement, sets processed_at\
    \ or clears the claim\n--\n-- A claim is a lease, not a lock, so a dispatcher that crashes mid-flight\n\
    -- does not strand its rows: any claim older than the lease window is\n-- reclaimable. Delivery is\
    \ therefore at-least-once, which is safe because\n-- every downstream call carries an Idempotency-Key\
    \ and processed_events\n-- dedupes on replay.\n--\n-- Rule 10: run as a Job or InitContainer, never\
    \ in the app startup path.\n--   psql -U admin -d order_db -f migrations/006_dispatcher_claim_lease.sql\n\
    --\n-- Idempotent.\n\nALTER TABLE public.outbox_messages\n    ADD COLUMN IF NOT EXISTS claimed_at\
    \ timestamp with time zone;\n\nALTER TABLE public.outbox_messages\n    ADD COLUMN IF NOT EXISTS claimed_by\
    \ text;\n\n-- The claim query filters on processed_at IS NULL and orders by created_at.\n-- Replaces\
    \ the previous partial index, which did not cover the claim column.\nDROP INDEX IF EXISTS ix_outbox_unprocessed_commands;\n\
    \nCREATE INDEX IF NOT EXISTS ix_outbox_claimable\n    ON public.outbox_messages (created_at)\n   \
    \ WHERE processed_at IS NULL;\n"
  007_payment_db_processed_webhooks.sql: "-- 007 (payment_ledger_db): durable webhook deduplication\n\
    --\n-- Layer 3 of the four in \xA74. Redis (layer 2) answers the common case cheaply,\n-- but it is\
    \ memory: a flush, a restart without persistence, or an eviction\n-- turns every past webhook into\
    \ a new one, and a PSP replaying a week of\n-- events would then be charged straight through to the\
    \ outbox.\n--\n-- Owned by payment-service's database rather than by webhook-handler, which\n-- has\
    \ no database of its own (\xA73b). The handler writes here and to\n-- outbox_messages in the same\
    \ transaction, so an event can never be marked\n-- processed without the event it produced.\n--\n\
    --   psql -U admin -d payment_ledger_db -f migrations/007_payment_db_processed_webhooks.sql\n\nCREATE\
    \ TABLE IF NOT EXISTS processed_webhooks (\n    -- The PSP's own event id. PRIMARY KEY is the dedup:\
    \ a second delivery of\n    -- the same event cannot insert, and ON CONFLICT DO NOTHING turns that\
    \ into\n    -- a rowcount of zero rather than an error.\n    event_id     TEXT        NOT NULL PRIMARY\
    \ KEY,\n    event_type   TEXT        NOT NULL,\n    received_at  TIMESTAMPTZ NOT NULL DEFAULT NOW()\n\
    );\n\n-- Retention sweeps by age, and the dedup window is 7 days.\nCREATE INDEX IF NOT EXISTS ix_processed_webhooks_received_at\n\
    \    ON processed_webhooks (received_at);\n"
  008_notification_db_delivery_state.sql: "-- 008 (notification_db): delivery state for notification-worker\n\
    --\n-- notification-service owns the notification; the worker owns its delivery\n-- (\xA73b). Delivery\
    \ needs state the service never had: how many times it has\n-- been attempted, when it may next be\
    \ tried, and which worker is holding it.\n--\n-- Same claim-lease shape as 006 for the saga dispatcher,\
    \ and for the same\n-- reason: the worker must never hold a database transaction across a call to\n\
    -- an external provider. It claims in one short transaction, dispatches with no\n-- transaction open,\
    \ then settles in another. A claim is a lease, so a worker\n-- that dies mid-send does not strand\
    \ rows -- any claim older than the lease\n-- window is reclaimable, which makes delivery at-least-once\
    \ rather than\n-- at-most-once. For notifications that is the right trade: a duplicate email\n-- is\
    \ embarrassing, a silently dropped password reset is a support ticket.\n--\n-- Rule 10: run as a Job\
    \ or InitContainer, never in the app startup path.\n--   psql -U admin -d notification_db -f migrations/008_notification_db_delivery_state.sql\n\
    --\n-- Idempotent.\n\nALTER TABLE public.notification_records\n    ADD COLUMN IF NOT EXISTS attempts\
    \ integer NOT NULL DEFAULT 0;\n\nALTER TABLE public.notification_records\n    ADD COLUMN IF NOT EXISTS\
    \ next_attempt_at timestamp with time zone DEFAULT NOW();\n\nALTER TABLE public.notification_records\n\
    \    ADD COLUMN IF NOT EXISTS claimed_at timestamp with time zone;\n\nALTER TABLE public.notification_records\n\
    \    ADD COLUMN IF NOT EXISTS claimed_by text;\n\nALTER TABLE public.notification_records\n    ADD\
    \ COLUMN IF NOT EXISTS last_error text;\n\nALTER TABLE public.notification_records\n    ADD COLUMN\
    \ IF NOT EXISTS delivered_at timestamp with time zone;\n\n-- The claim query filters on exactly these\
    \ three columns. Without the index it\n-- is a sequential scan of every notification ever sent, repeated\
    \ every poll.\nCREATE INDEX IF NOT EXISTS ix_notification_records_claimable\n    ON public.notification_records\
    \ (status, next_attempt_at, claimed_at);\n"

---
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: ecommerce
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: db-migrate
        tier: job
    spec:
      restartPolicy: Never
      containers:
      - name: psql
        image: postgres:15-alpine
        command:
        - sh
        - -c
        - 'set -euo pipefail

          echo "waiting for postgres..."

          until pg_isready -h "$PGHOST" -U "$PGUSER" >/dev/null 2>&1; do sleep 2; done

          echo "postgres ready"

          echo "--> 001_add_idempotency_result_id.sql -> order_db"

          psql -v ON_ERROR_STOP=1 -h "$PGHOST" -U "$PGUSER" -d order_db -f /migrations/001_add_idempotency_result_id.sql

          echo "--> 001_add_idempotency_result_id.sql -> inventory_db"

          psql -v ON_ERROR_STOP=1 -h "$PGHOST" -U "$PGUSER" -d inventory_db -f /migrations/001_add_idempotency_result_id.sql

          echo "--> 001_add_idempotency_result_id.sql -> payment_ledger_db"

          psql -v ON_ERROR_STOP=1 -h "$PGHOST" -U "$PGUSER" -d payment_ledger_db -f /migrations/001_add_idempotency_result_id.sql

          echo "--> 001_add_idempotency_result_id.sql -> fraud_db"

          psql -v ON_ERROR_STOP=1 -h "$PGHOST" -U "$PGUSER" -d fraud_db -f /migrations/001_add_idempotency_result_id.sql

          echo "--> 001_add_idempotency_result_id.sql -> cart_db"

          psql -v ON_ERROR_STOP=1 -h "$PGHOST" -U "$PGUSER" -d cart_db -f /migrations/001_add_idempotency_result_id.sql

          echo "--> 002_cart_db_create_cart_state.sql -> cart_db"

          psql -v ON_ERROR_STOP=1 -h "$PGHOST" -U "$PGUSER" -d cart_db -f /migrations/002_cart_db_create_cart_state.sql

          echo "--> 003_promo_db_create_tables.sql -> promo_db"

          psql -v ON_ERROR_STOP=1 -h "$PGHOST" -U "$PGUSER" -d promo_db -f /migrations/003_promo_db_create_tables.sql

          echo "--> 004_outbox_for_audit_and_media.sql -> audit_db"

          psql -v ON_ERROR_STOP=1 -h "$PGHOST" -U "$PGUSER" -d audit_db -f /migrations/004_outbox_for_audit_and_media.sql

          echo "--> 004_outbox_for_audit_and_media.sql -> media_meta_db"

          psql -v ON_ERROR_STOP=1 -h "$PGHOST" -U "$PGUSER" -d media_meta_db -f /migrations/004_outbox_for_audit_and_media.sql

          echo "--> 005_dispatcher_processed_state.sql -> order_db"

          psql -v ON_ERROR_STOP=1 -h "$PGHOST" -U "$PGUSER" -d order_db -f /migrations/005_dispatcher_processed_state.sql

          echo "--> 006_dispatcher_claim_lease.sql -> order_db"

          psql -v ON_ERROR_STOP=1 -h "$PGHOST" -U "$PGUSER" -d order_db -f /migrations/006_dispatcher_claim_lease.sql

          echo "ALL MIGRATIONS APPLIED"

          '
        env:
        - name: PGHOST
          value: postgres
        - name: PGUSER
          value: admin
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: ecommerce-secrets
              key: POSTGRES_PASSWORD
        volumeMounts:
        - name: migrations
          mountPath: /migrations
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
      volumes:
      - name: migrations
        configMap:
          name: db-migrations
