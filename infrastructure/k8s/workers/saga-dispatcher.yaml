# saga-dispatcher — Deployment + Service
# GENERATED by scripts/generate_k8s.py — do not edit by hand.
# Regenerate after changing docker-compose.apps.yml.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: saga-dispatcher
  namespace: ecommerce
  labels:
    app: saga-dispatcher
    tier: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: saga-dispatcher
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: saga-dispatcher
        tier: worker
    spec:
      containers:
      - name: saga-dispatcher
        image: ecommerce-platform-saga-dispatcher:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ecommerce-secrets
              key: POSTGRES_PASSWORD
        - name: INVENTORY_URL
          value: http://inventory-service:8013/inventory
        - name: ORDER_DATABASE_URL
          value: postgresql://admin:$(POSTGRES_PASSWORD)@postgres:5432/order_db
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://jaeger:4318
        - name: PAYMENT_URL
          value: http://payment-service:8015/payments
        - name: PYTHONPATH
          value: /app:/app/shared_libs
        - name: SAGA_URL
          value: http://order-saga:8012/orders
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
        command:
        - uvicorn
        - app.main:app
        - --host
        - 0.0.0.0
        - --port
        - '8030'
        ports:
        - containerPort: 8030
          name: http
        readinessProbe:
          httpGet: &id001
            path: /health
            port: 8030
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet: *id001
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 5
      securityContext:
        fsGroup: 1000
      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: saga-dispatcher
  namespace: ecommerce
  labels:
    app: saga-dispatcher
spec:
  type: ClusterIP
  selector:
    app: saga-dispatcher
  ports:
  - name: http
    port: 8030
    targetPort: 8030
    protocol: TCP
