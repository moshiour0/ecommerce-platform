# DEV-ONLY infrastructure for a local cluster.
#
# NOT for production. Storage is emptyDir, so every Postgres restart loses all
# data; there is one replica of everything and no backup, no PDB, no TLS.
# In a real cluster these are operators or managed services -- which is why
# the generated service manifests deliberately exclude them.
#
# Present here only so the application manifests can actually be exercised
# against a cluster instead of coming up and failing readiness forever.
#
# Kafka, Zookeeper, Schema Registry, Debezium and Elasticsearch are NOT
# included: they are memory-hungry and only stream-processor, search-service
# and the CDC layer need them. Those three will not reach readiness here.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: ecommerce
data:
  init-dbs.sh: "#!/bin/bash\nset -e\necho \"Creating isolated databases for microservices (Rule 2.1)...\"\
    \npsql -v ON_ERROR_STOP=1 --username \"$POSTGRES_USER\" --dbname \"$POSTGRES_DB\" <<-EOSQL\n    CREATE\
    \ DATABASE user_db;\n    CREATE DATABASE catalog_db;\n    CREATE DATABASE pricing_db;\n    CREATE\
    \ DATABASE promo_db;\n    CREATE DATABASE tax_db;\n    CREATE DATABASE delivery_quote_db;\n    CREATE\
    \ DATABASE order_db;\n    CREATE DATABASE inventory_db;\n    CREATE DATABASE cart_db;\n    CREATE\
    \ DATABASE fraud_db;\n    CREATE DATABASE payment_ledger_db;\n    CREATE DATABASE fulfillment_db;\n\
    \    CREATE DATABASE notification_db;\n    CREATE DATABASE media_meta_db;\n    CREATE DATABASE audit_db;\n\
    EOSQL\necho \"Isolated databases created successfully.\"\n"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: ecommerce
  labels:
    app: postgres
    tier: infra
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        tier: infra
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5432
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        env:
        - name: POSTGRES_USER
          value: admin
        - name: POSTGRES_DB
          value: postgres
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ecommerce-secrets
              key: POSTGRES_PASSWORD
        args:
        - postgres
        - -c
        - wal_level=logical
        - -c
        - max_replication_slots=25
        - -c
        - max_wal_senders=25
        volumeMounts:
        - name: init
          mountPath: /docker-entrypoint-initdb.d
        - name: data
          mountPath: /var/lib/postgresql/data
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - admin
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 30
      volumes:
      - name: init
        configMap:
          name: postgres-init
          defaultMode: 493
      - name: data
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ecommerce
  labels:
    app: postgres
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: ecommerce
  labels:
    app: redis
    tier: infra
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        tier: infra
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: ecommerce
  labels:
    app: redis
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: ecommerce
  labels:
    app: jaeger
    tier: infra
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
        tier: infra
    spec:
      containers:
      - name: jaeger
        image: jaegertracing/all-in-one:1.57
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 4318
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 512Mi
        env:
        - name: COLLECTOR_OTLP_ENABLED
          value: 'true'
        readinessProbe:
          httpGet:
            path: /
            port: 16686
          initialDelaySeconds: 10
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: ecommerce
  labels:
    app: jaeger
spec:
  type: ClusterIP
  selector:
    app: jaeger
  ports:
  - name: otlp-http
    port: 4318
    targetPort: 4318
  - name: ui
    port: 16686
    targetPort: 16686
