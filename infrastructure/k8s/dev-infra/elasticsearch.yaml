# DEV-ONLY Elasticsearch for a local cluster.
#
# NOT for production. Single node, security disabled, no volume at all -- every
# restart loses the whole index. A real cluster uses ECK or a managed service
# with at least three nodes, TLS, authentication and persistent storage.
#
# Required by search-service (ELASTICSEARCH_URL) and stream-processor, which
# hardcodes elasticsearch:9200 and crash-looped without it. Reindexing from
# Kafka rebuilds the read model after a restart, which is why ephemeral storage
# is tolerable here and would not be in production.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  namespace: ecommerce
  labels:
    app: elasticsearch
    tier: infra
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
        tier: infra
    spec:
      enableServiceLinks: false
      containers:
      - name: elasticsearch
        image: docker.elastic.co/elasticsearch/elasticsearch:8.10.2
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9200
        env:
        - name: discovery.type
          value: single-node
        - name: xpack.security.enabled
          value: 'false'
        - name: ES_JAVA_OPTS
          value: -Xms512m -Xmx512m
        - name: bootstrap.memory_lock
          value: 'false'
        resources:
          requests:
            cpu: 200m
            memory: 1Gi
          limits:
            cpu: 1500m
            memory: 1792Mi
        readinessProbe:
          httpGet:
            path: /_cluster/health?wait_for_status=yellow&timeout=1s
            port: 9200
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 40

---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: ecommerce
  labels:
    app: elasticsearch
spec:
  type: ClusterIP
  selector:
    app: elasticsearch
  ports:
  - name: http
    port: 9200
    targetPort: 9200
