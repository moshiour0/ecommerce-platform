# TEMPLATE ONLY — do not apply as-is and do not fill in real values here.
#
# Rule 8 requires Vault-managed secrets and forbids hardcoded fallbacks. This
# file documents the *shape* the workloads expect; the values must come from
# Vault via the Vault Agent Injector or an ExternalSecret, so nothing secret is
# ever committed.
#
# For a local cluster, create the Secret imperatively instead of editing this
# file — that way the values never touch the repository:
#
#   kubectl -n ecommerce create secret generic ecommerce-secrets \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -hex 24)" \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=PSP_WEBHOOK_SECRET="<the value the PSP signs with>"
#
# Every Deployment references these keys via secretKeyRef. DATABASE_URL is
# assembled in the pod using Kubernetes $(VAR) expansion, so the password is
# never written into a manifest — see scripts/generate_k8s.py.
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secrets
  namespace: ecommerce
type: Opaque
stringData:
  # Replace via Vault/ExternalSecret. Placeholders deliberately invalid so an
  # accidental `kubectl apply` of this file fails loudly at connection time
  # rather than silently running the platform on a known credential.
  POSTGRES_PASSWORD: "REPLACE_ME_FROM_VAULT"
  JWT_SECRET: "REPLACE_ME_FROM_VAULT"
  # Not generated by us: this is the signing secret the payment provider
  # issues, so it is copied from their dashboard rather than invented.
  # webhook-handler refuses to start without it.
  PSP_WEBHOOK_SECRET: "REPLACE_ME_FROM_VAULT"
---
